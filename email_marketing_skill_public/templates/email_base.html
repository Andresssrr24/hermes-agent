<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{TITLE}}</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .email-bg { background-color: #0f0f1a !important; }
      .email-card { background-color: #1c1c2e !important; }
      .email-text { color: #d8d8e4 !important; }
      .email-heading { color: #ffffff !important; }
      .email-footer-bg { background-color: #0a0a14 !important; }
    }
    @media only screen and (max-width: 600px) {
      .email-padding { padding: 30px 24px !important; }
      .email-title { font-size: 24px !important; }
      .email-cta { padding: 16px 24px !important; font-size: 15px !important; width: 100% !important; box-sizing: border-box !important; }
      .email-logo { width: 160px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f9;" class="email-bg">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);" class="email-card">
          <tr>
            <td style="background:linear-gradient(150deg,{{PRIMARY_COLOR}} 0%,{{SECONDARY_COLOR}} 100%);padding:36px 48px;text-align:center;">
              {{LOGO_HTML}}
            </td>
          </tr>
          <tr>
            <td style="padding:0 48px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="height:1px;background:linear-gradient(to right,transparent,{{PRIMARY_COLOR}},transparent);font-size:0;line-height:0;">&nbsp;</td></tr></table>
            </td>
          </tr>
          <tr>
            <td style="padding:40px 48px;" class="email-padding">
              <h1 style="font-size:28px;color:#1a1a2e;margin:0 0 20px 0;font-weight:700;letter-spacing:-0.5px;line-height:1.3;" class="email-heading email-title">{{HEADING}}</h1>
              {{BODY_HTML}}
              <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 28px auto;">
                <tr>
                  <td style="background-color:{{PRIMARY_COLOR}};border-radius:12px;text-align:center;">
                    <a href="{{CALENDLY_URL}}" target="_blank" style="display:inline-block;padding:16px 40px;font-size:16px;color:#ffffff;text-decoration:none;font-weight:600;background-color:{{PRIMARY_COLOR}};border-radius:12px;letter-spacing:0.3px;" class="email-cta">{{CTA_LABEL}}</a>
                  </td>
                </tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width:4px;background-color:{{PRIMARY_COLOR}};border-radius:2px;font-size:0;line-height:0;">&nbsp;</td>
                  <td style="padding-left:16px;">
                    <p style="font-size:16px;color:#444444;line-height:1.6;margin:0;" class="email-text">{{SIGNOFF}}<br><strong style="color:{{PRIMARY_COLOR}};font-size:17px;">{{COMPANY_NAME}}</strong></p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 48px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="height:1px;background:linear-gradient(to right,transparent,#d0d0d0,transparent);font-size:0;line-height:0;">&nbsp;</td></tr></table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 48px;text-align:center;">
              {{SOCIAL_HTML}}
              <p style="font-size:12px;color:#aaaaaa;margin:18px 0 0 0;"><a href="{{{RESEND_UNSUBSCRIBE_URL}}}" target="_blank" style="color:{{PRIMARY_COLOR}};text-decoration:underline;font-size:12px;">{{UNSUBSCRIBE_LABEL}}</a></p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#0f0f1a;padding:20px 48px;text-align:center;" class="email-footer-bg">
              <p style="font-size:12px;color:#666666;margin:0;letter-spacing:0.3px;">{{COMPANY_NAME}} &bull; {{FOOTER_TEXT}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
